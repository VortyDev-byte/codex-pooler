# Local Vortex Codex Pooler overlay.
#
# Keep the upstream compose file untouched: start with both files so this
# checkout (rather than the published upstream image) is built and run.
name: vortex-codex-pooler

services:
  migrate:
    build:
      context: .
      network: host
    image: vortex-codex-pooler:local

  app:
    build:
      context: .
      network: host
    image: vortex-codex-pooler:local
    ports:
      - "4100:4000"

volumes:
  codex-pooler-postgres:
    name: vortex-codex-pooler-postgres
